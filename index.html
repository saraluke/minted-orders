<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara Luke Creative — Minted Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink-light: #F3C4D6; --navy: #394350; --pink-dark: #D56D85;
    --green: #58634F; --tangerine: #E49855; --bg: #faf8f6;
    --card: #ffffff; --border: #e8e0d8; --text: #2a2420; --muted: #8a7f78;
    --status-proof: #7b9cc4;
    --status-approved: #9b7fc4;
    --status-production: #c4a44a;
    --status-complete: #58634F;
    --msg-color: #c47b4a;
    --proof-overdue: #b85c5c;
  }
  body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--navy); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--pink-dark); }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--pink-light); font-weight: 400; }
  header .subtitle { font-size: 0.7rem; color: var(--pink-dark); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  #refresh-btn { background: transparent; border: 1px solid var(--pink-dark); color: var(--pink-light); padding: 6px 14px; border-radius: 3px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  #refresh-btn:hover { background: var(--pink-dark); color: white; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; display: inline-block; }
  .status-dot.loaded { background: #7cb87c; }
  .status-dot.loading { background: var(--tangerine); animation: pulse 1s infinite; }
  .status-dot.error { background: #c97070; }
  .sync-label { font-size: 0.65rem; color: var(--pink-dark); letter-spacing: 0.06em; opacity: 0.8; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .main { max-width: 960px; margin: 0 auto; padding: 28px 24px; }
  .loading-state, .error-state { text-align: center; padding: 80px 24px; color: var(--muted); }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--pink-dark); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .order-count { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-right: auto; white-space: nowrap; }
  .toolbar-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn { background: white; border: 1.5px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 20px; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .filter-btn:hover { border-color: var(--navy); color: var(--navy); }
  .filter-btn.active { background: var(--navy); border-color: var(--navy); color: white; }
  .filter-btn.f-proof-complete.active { background: #a0b8a0; border-color: #a0b8a0; color: white; }
  .filter-btn.f-proof.active { background: var(--status-proof); border-color: var(--status-proof); }
  .filter-btn.f-approved.active { background: var(--status-approved); border-color: var(--status-approved); }
  .filter-btn.f-production.active { background: var(--status-production); border-color: var(--status-production); }
  .filter-btn.f-complete.active { background: var(--status-complete); border-color: var(--status-complete); }
  .filter-btn.f-pending.active { background: var(--navy); border-color: var(--navy); }

  .selection-banner { background: #eef1f5; border: 1px solid #c8d0db; border-radius: 6px; padding: 9px 16px; margin-bottom: 12px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; }
  .selection-banner.visible { display: flex; }
  .selection-banner-count { font-size: 0.78rem; font-weight: 600; color: var(--navy); margin-right: auto; }

  .bulk-bar { background: var(--navy); border-radius: 6px; padding: 10px 16px; margin-bottom: 14px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bulk-bar.visible { display: flex; }
  .bulk-count { font-size: 0.72rem; color: var(--pink-light); font-weight: 600; margin-right: auto; }
  .bulk-btn { padding: 6px 14px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.15s; white-space: nowrap; }
  .bulk-btn-proof { background: var(--status-proof); color: white; }
  .bulk-btn-approved { background: var(--status-approved); color: white; }
  .bulk-btn-production { background: var(--status-production); color: white; }
  .bulk-btn-complete { background: var(--status-complete); color: white; }
  .bulk-btn-clear { background: transparent; color: #aaa; border: 1px solid #555; }
  .bulk-btn:hover { opacity: 0.85; }
  .bulk-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .select-all-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.7rem; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  .select-all-row input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--navy); }

  .order-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s; }
  .order-card:hover { box-shadow: 0 3px 12px rgba(57,67,80,0.07); }
  .order-card.hidden { display: none; }
  .sku-subsection.hidden { display: none; }
  .order-card.selected { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(57,67,80,0.15); }
  .order-card.s-proof { border-left: 4px solid var(--status-proof); }
  .order-card.s-proof-complete { border-left: 4px solid #a0b8a0; }
  .order-card.s-approved { border-left: 4px solid var(--status-approved); }
  .order-card.s-production { border-left: 4px solid var(--status-production); }
  .order-card.s-complete { border-left: 4px solid var(--status-complete); opacity: 0.5; }
  .order-card.proof-overdue { border-left: 4px solid var(--proof-overdue) !important; background: #fff8f8; }
  .badge-overdue { background: var(--proof-overdue); color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .proof-sent-time { font-size: 0.62rem; color: var(--status-proof); letter-spacing: 0.02em; }
  .order-card.proof-overdue .proof-sent-time { color: var(--proof-overdue); }

  .card-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .card-header:hover { background: #fdf9fb; }
  .card-checkbox { flex-shrink: 0; width: 15px; height: 15px; cursor: pointer; accent-color: var(--navy); }
  .order-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; color: var(--navy); min-width: 150px; }
  .order-card.s-complete .order-name { text-decoration: line-through; color: var(--muted); }
  .order-meta { font-size: 0.7rem; color: var(--muted); display: flex; gap: 12px; flex: 1; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .badge-design { background: #faeef2; color: var(--pink-dark); }
  .badge-slip { background: #eef3ea; color: var(--green); }
  .badge-note { background: var(--proof-overdue); color: white; display: inline-flex; align-items: center; gap: 4px; cursor: help; }
  .badge-msg { background: var(--msg-color); color: white; font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; animation: msg-pulse 2s ease-in-out infinite; }
  @keyframes msg-pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
  .status-badge { font-size: 0.6rem; padding: 2px 9px; border-radius: 20px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: white; }
  .sb-proof { background: var(--status-proof); }
  .sb-proof-complete { background: #a0b8a0; }
  .sb-approved { background: var(--status-approved); }
  .sb-production { background: var(--status-production); }
  .sb-complete { background: var(--status-complete); }
  .chevron { color: var(--muted); font-size: 0.7rem; transition: transform 0.2s; flex-shrink: 0; margin-left: auto; }
  .order-card.open .chevron { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .order-card.open .card-body { display: block; }
  .section-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin: 12px 0 5px; }
  .pers-box { background: #f8f5f2; border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-size: 0.82rem; line-height: 1.7; color: var(--text); white-space: pre-wrap; font-family: 'Montserrat', sans-serif; }
  .file-path { font-size: 0.7rem; color: var(--muted); font-family: 'Courier New', monospace; word-break: break-all; background: #f8f5f2; padding: 7px 10px; border-radius: 4px; border: 1px solid var(--border); }

  /* ── Messages panel ── */
  .messages-toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; cursor: pointer; user-select: none; }
  .messages-toggle-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--msg-color); font-weight: 600; }
  .messages-chevron { font-size: 0.6rem; color: var(--msg-color); transition: transform 0.2s; }
  .messages-panel { display: none; margin-top: 6px; border: 1px solid #e8d5c4; border-radius: 4px; overflow: hidden; }
  .messages-panel.open { display: block; }
  .messages-scroll { max-height: 220px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .message-item { background: #fdf6f0; border: 1px solid #e8d5c4; border-radius: 4px; padding: 10px 12px; }
  .message-item-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
  .message-item-from { font-size: 0.62rem; font-weight: 600; color: var(--msg-color); letter-spacing: 0.04em; }
  .message-item-link { font-size: 0.6rem; color: var(--navy); text-decoration: none; border: 1px solid var(--navy); border-radius: 3px; padding: 2px 7px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
  .message-item-link:hover { background: var(--navy); color: white; }
  .message-item-text { font-size: 0.78rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

  .production-note-area { margin-top: 10px; }
  .production-note-display { font-size: 0.78rem; color: var(--text); background: #fffbf0; border: 1px solid #e8dfc0; border-radius: 4px; padding: 8px 12px; font-style: italic; display: none; }
  .production-note-display.visible { display: block; }
  .note-edit-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .note-input { flex: 1; border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--text); background: white; }
  .note-input:focus { outline: none; border-color: var(--status-production); }
  .note-save-btn { background: var(--status-production); color: white; border: none; border-radius: 4px; padding: 7px 14px; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .note-save-btn:hover { opacity: 0.85; }

  /* ── Private note ── */
  .private-note-area { margin-top: 10px; }
  .private-note-input { flex: 1; border: 1px solid #e0c0c5; border-radius: 4px; padding: 7px 10px; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--text); background: #fdf6f7; }
  .private-note-input:focus { outline: none; border-color: var(--proof-overdue); }
  .private-note-save-btn { background: var(--proof-overdue); color: white; border: none; border-radius: 4px; padding: 7px 14px; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .private-note-save-btn:hover { opacity: 0.85; }

  /* ── Type dropdown ── */
  .type-select { border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-family: 'Montserrat', sans-serif; font-size: 0.75rem; color: var(--text); background: white; cursor: pointer; }
  .type-select:focus { outline: none; border-color: var(--status-approved); }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; border: none; transition: all 0.15s; text-decoration: none; white-space: nowrap; }
  .btn-navy { background: var(--navy); color: white; }
  .btn-navy:hover { background: #2a3140; }
  .btn-outline { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-outline:hover { background: var(--navy); color: white; }
  .btn-pink { background: var(--pink-dark); color: white; }
  .btn-pink:hover { background: #c45e76; }
  .btn-green { background: var(--green); color: white; }
  .btn-green:hover { background: #47523f; }
  .btn.copied { background: var(--green) !important; border-color: var(--green) !important; color: white !important; }

  .status-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .s-btn { padding: 6px 12px; border-radius: 20px; font-family: 'Montserrat', sans-serif; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
  .s-btn-proof { background: white; color: var(--status-proof); border-color: var(--status-proof); }
  .s-btn-proof.active, .s-btn-proof:hover { background: var(--status-proof); color: white; }
  .s-btn-proof-complete { background: white; color: #6e8f6e; border-color: #a0b8a0; }
  .s-btn-proof-complete.active, .s-btn-proof-complete:hover { background: #a0b8a0; color: white; }
  .s-btn-approved { background: white; color: var(--status-approved); border-color: var(--status-approved); }
  .s-btn-approved.active, .s-btn-approved:hover { background: var(--status-approved); color: white; }
  .s-btn-production { background: white; color: var(--status-production); border-color: var(--status-production); }
  .s-btn-production.active, .s-btn-production:hover { background: var(--status-production); color: white; }
  .s-btn-complete { background: white; color: var(--status-complete); border-color: var(--status-complete); }
  .s-btn-complete.active, .s-btn-complete:hover { background: var(--status-complete); color: white; }
  .s-btn-none { background: white; color: var(--muted); border-color: var(--border); }
  .s-btn-none:hover { background: #f0eeec; }

  .date-label { font-size: 0.65rem; }
  .empty { text-align: center; padding: 60px; color: var(--muted); font-size: 0.85rem; }

  /* ── SKU Subsection Grouping ── */
  .sku-subsection { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .sku-subsection-header { background: #f5f3f0; padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
  .sku-subsection.open .sku-subsection-header { background: #ede8e2; }
  .sku-subsection-title { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-weight: 600; color: var(--navy); }
  .sku-subsection-count { font-size: 0.65rem; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; margin-left: auto; }
  .sku-subsection-chevron { font-size: 0.65rem; color: var(--muted); transition: transform 0.2s; }
  .sku-subsection.open .sku-subsection-chevron { transform: rotate(180deg); }
  .sku-subsection-cards { display: none; padding: 10px 10px; }
  .sku-subsection.open .sku-subsection-cards { display: block; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-overlay.visible { display: flex; }
  .modal { background: white; border-radius: 8px; padding: 28px; width: 440px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--navy); margin-bottom: 6px; }
  .modal p { font-size: 0.78rem; color: var(--muted); margin-bottom: 16px; }
  .modal textarea { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; color: var(--text); resize: vertical; min-height: 80px; }
  .modal textarea:focus { outline: none; border-color: var(--status-production); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .modal-skip { background: white; color: var(--muted); border: 1px solid var(--border); padding: 8px 18px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .modal-save { background: var(--status-production); color: white; border: none; padding: 8px 18px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .modal-save:hover { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Sara Luke Creative</h1>
    <div class="subtitle">Minted Orders</div>
  </div>
  <div class="header-right">
    <span class="sync-label" id="sync-label"></span>
    <span class="status-dot" id="status-dot"></span>
    <button id="refresh-btn" onclick="loadOrders()">↺ Refresh</button>
  </div>
</header>

<div class="main">
  <div id="toolbar" style="display:none">

    <div class="toolbar-top">
      <span class="order-count" id="order-count"></span>
      <button id="refresh-btn2" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:20px;font-family:Montserrat,sans-serif;font-size:0.65rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;" onclick="loadOrders()">↺ Refresh</button>
    </div>

    <div class="toolbar-filters">
      <button class="filter-btn f-pending active" id="filter-pending" onclick="setFilter('pending')">No Status</button>
      <button class="filter-btn f-proof-complete" id="filter-proof-complete" onclick="setFilter('proof-complete')">Proof Ready</button>
      <button class="filter-btn f-proof" id="filter-proof" onclick="setFilter('proof')">Proof Sent</button>
      <button class="filter-btn f-approved" id="filter-approved" onclick="setFilter('approved')">Approved</button>
      <button class="filter-btn f-production" id="filter-production" onclick="setFilter('production')">In Production</button>
      <button class="filter-btn f-complete" id="filter-complete" onclick="setFilter('complete')">Completed</button>
      <button class="filter-btn" id="filter-all" onclick="setFilter('all')">All</button>
    </div>

    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <input id="note-search" type="text" placeholder="Filter by note text..." oninput="applyVisibility()" style="border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;font-family:Montserrat,sans-serif;font-size:0.7rem;color:var(--text);width:240px;background:white;" />
      <button onclick="clearNoteSearch()" style="background:transparent;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;font-family:Montserrat,sans-serif;padding:0 2px;" title="Clear note filter">✕</button>
    </div>

    <div class="selection-banner" id="selection-banner">
      <span class="selection-banner-count" id="selection-banner-count">0 orders selected</span>
    </div>

    <div class="bulk-bar" id="bulk-bar">
      <span class="bulk-count" id="bulk-count">0 selected</span>
      <button class="bulk-btn" style="background:#a0b8a0;color:white;" onclick="bulkSetStatus('proof-complete')">Proof Ready</button>
      <button class="bulk-btn bulk-btn-proof" onclick="bulkSetStatus('proof')">Proof Sent</button>
      <button class="bulk-btn bulk-btn-approved" onclick="bulkSetStatus('approved')">Approved</button>
      <button class="bulk-btn bulk-btn-production" onclick="bulkSetStatus('production')">Sent to Production</button>
      <button class="bulk-btn bulk-btn-complete" onclick="bulkSetStatus('complete')">Complete</button>
      <button class="bulk-btn" id="copy-links-btn" style="background:#5a7a6a;color:white;" onclick="copySelectedLinks('order')">Copy Order Links</button>
      <button class="bulk-btn" id="copy-msg-links-btn" style="background:#5a7a6a;color:white;" onclick="copySelectedLinks('msg')">Copy Message Links</button>
      <button class="bulk-btn" id="copy-slips-btn" style="background:var(--tangerine);color:white;" onclick="copySelectedLinks('slip')">Copy Slip Links</button>
      <button class="bulk-btn bulk-btn-clear" onclick="clearSelection()">Clear</button>
    </div>

    <div class="select-all-row">
      <input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)">
      <label for="select-all-cb">Select all visible</label>
    </div>

  </div>

  <div id="app">
    <div class="loading-state"><div class="spinner"></div>Loading orders...</div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">

function setSyncLabel(msg) {

function scriptURL(params) {
  var parts = [SCRIPT_URL];
  var first = true;
  for (var k in params) {
    parts.push((first ? '?' : '&') + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    first = false;
  }
  return parts.join('');
}

// Saves go through a hidden iframe form POST instead of a GET fetch.
// GET puts the entire JSON payload in the URL, which Google rejects (400)
// once the data grows past the URL length limit. Form POST has no such
// limit and, because it targets an iframe, never triggers a CORS preflight.
function postToScript(key, value, onDone) {
  var frameName = 'post-frame-' + Date.now() + '-' + Math.floor(Math.random() * 100000);
  var iframe = document.createElement('iframe');
  iframe.name = frameName;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  var form = document.createElement('form');
  form.method = 'POST';
  form.action = SCRIPT_URL;
  form.target = frameName;
  form.style.display = 'none';

  var fields = { action: 'set', key: key, value: value };
  for (var k in fields) {
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = k;
    input.value = fields[k];
    form.appendChild(input);
  }
  document.body.appendChild(form);

  iframe.onload = function() {
    if (onDone) onDone();
    setTimeout(function() {
      if (form.parentNode) form.parentNode.removeChild(form);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }, 500);
  };

  form.submit();
}

function setDot(state) { document.getElementById('status-dot').className = 'status-dot ' + state; }

function parseCSV(text) {
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i], next = text[i+1];
    if (inQuotes) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n' || (ch === '\r' && next === '\n')) {
        row.push(field); field = '';
        rows.push(row); row = [];
        if (ch === '\r') i++;
      } else { field += ch; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseDate(str) {
  if (!str) return 0;
  var d = new Date(str);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

function formatDate(str) {
  if (!str) return '';
  var d = new Date(str);
  if (isNaN(d.getTime())) return '';
  return (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
}

function formatProofTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  var mm = m < 10 ? '0' + m : m;
  return (d.getMonth()+1) + '/' + d.getDate() + ' at ' + h + ':' + mm + ampm;
}

function applySKUCorrection(design) {
  return SKU_CORRECTIONS[design] || design;
}

function getSkuCategory(sku) {
  if (!sku) return 'default';
  var lower = sku.toLowerCase();
  if (lower.endsWith('-wood')) return 'wood';
  if (lower.endsWith('-emboss')) return 'emboss';
  return 'default';
}

// Effective category = manual override (if she's changed it) falling back to the auto SKU-based detection
function getEffectiveSkuCategory(o) {
  return skuOverrideData[o.id] || getSkuCategory(o.design);
}

// Combined "Type — private note" text stamped onto each delivery slip PDF by the merger tool
function buildSlipStampText(o) {
  var type = TYPE_LABELS[getEffectiveSkuCategory(o)] || '';
  var note = (privateNotesData[o.id] || '').trim();
  return note ? (type + '  —  ' + note) : type;
}

function loadMessages(callback) {
  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + SHEET2_GID;
  fetch(url).then(function(res) {
    if (!res.ok) { callback(); return; }
    return res.text();
  }).then(function(text) {
    if (!text) { callback(); return; }
    messagesData = {};
    var rows = parseCSV(text);
    rows.forEach(function(row, i) {
      if (i === 0) return; // skip header
      var orderNum = (row[0] || '').trim().replace(/^#/, '');
      if (!orderNum) return;
      var name = (row[1] || '').trim();
      var msgText = (row[2] || '').trim();
      var link = (row[3] || '').trim();
      if (!messagesData[orderNum]) messagesData[orderNum] = [];
      messagesData[orderNum].push({ name: name, text: msgText, link: link });
    });
    callback();
  }).catch(function() { callback(); });
}

function loadOrders() {
  setDot('loading');
  selectedIds = {};
  var app = document.getElementById('app');
  document.getElementById('toolbar').style.display = 'none';
  app.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading orders...</div>';

  loadPersistedData(function() {
    loadMessages(function() {
      var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=0';
      fetch(url).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function(text) {
        var rows = parseCSV(text);
        ordersData = [];
        rows.forEach(function(row, i) {
          var name = (row[0] || '').trim();
          if (!name || name === 'NAME') return;
          var design = (row[1] || '').trim();
          design = applySKUCorrection(design); // Apply correction here
          var orderNum = (row[6] || '').trim();
          var id = orderNum || ('row-' + i);
          ordersData.push({
            id: id,
            name: name,
            design: design,
            orderLink: (row[2] || '').trim(),
            pers: (row[3] || '').trim(),
            filePath: (row[4] || '').trim(),
            orderNum: orderNum,
            orderDate: (row[7] || '').trim(),
            msgLink: (row[9] || '').trim(),
            slipUrl: (row[12] || '').trim().replace('dl=0', 'dl=1'),
            rowIndex: i + 1
          });
        });
        ordersData.sort(function(a, b) { return parseDate(a.orderDate) - parseDate(b.orderDate); });
        if (ordersData.length === 0) {
          app.innerHTML = '<div class="empty">No orders found.</div>';
          setDot('error');
          return;
        }
        setDot('loaded');
        renderOrders();
        document.getElementById('toolbar').style.display = 'block';
        updateSelectionUI();
      }).catch(function(e) {
        setDot('error');
        app.innerHTML = '<div class="error-state">Could not load sheet.<br><br><small>' + e.message + '</small></div>';
      });
    });
  });
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hasUnreadMessages(o) {
  var msgs = messagesData[o.orderNum];
  if (!msgs || msgs.length === 0) return false;
  var seen = msgReadData[o.orderNum] || 0;
  return msgs.length > seen;
}

var STATUS_BADGE  = { proof: 'sb-proof', 'proof-complete': 'sb-proof-complete', approved: 'sb-approved', production: 'sb-production', complete: 'sb-complete' };

function renderOrderCard(o, i) {
  var st = statusData[o.id] || '';

  var privateNote = privateNotesData[o.id] || '';

  var isOverdue = proofTs && (Date.now() - proofTs > 24 * 60 * 60 * 1000);
  var effectiveType = getEffectiveSkuCategory(o);
  var cardClass = 'order-card' + (st ? ' ' + CARD_CLASS[st] : '');
  if (isOverdue) cardClass += ' proof-overdue';
  if (selectedIds[o.id]) cardClass += ' selected';

  var html = '<div class="' + cardClass + '" id="card-' + i + '">';
  html += '<div class="card-header">';
  html += '<input type="checkbox" class="card-checkbox" id="cb-' + i + '" ' + (selectedIds[o.id] ? 'checked' : '') + ' onclick="toggleSelect(event,' + i + ')">';
  html += '<span class="order-name" onclick="toggleCard(' + i + ')">' + esc(o.name) + '</span>';
  html += '<div class="order-meta" onclick="toggleCard(' + i + ')">';
  if (o.design) html += '<span><span class="badge badge-design">' + esc(o.design) + '</span></span>';
  if (st) html += '<span><span class="status-badge ' + STATUS_BADGE[st] + '">' + STATUS_LABELS[st] + '</span></span>';
  if (proofTs) html += '<span class="proof-sent-time">sent ' + formatProofTime(proofTs) + '</span>';
  if (isOverdue) html += '<span><span class="badge-overdue">24h passed</span></span>';
  if (unread) html += '<span><span class="badge-msg">✉ ' + msgs.length + ' message' + (msgs.length !== 1 ? 's' : '') + '</span></span>';
  if (privateNote) html += '<span><span class="badge badge-note" title="' + esc(privateNote) + '">● Note</span></span>';
  if (o.slipUrl) html += '<span><span class="badge badge-slip">✓ Slip</span></span>';
  if (o.orderNum) html += '<span>#' + esc(o.orderNum) + '</span>';
  if (o.orderDate) html += '<span class="date-label">' + formatDate(o.orderDate) + '</span>';
  html += '</div>';
  html += '<span class="chevron" onclick="toggleCard(' + i + ')">▼</span>';
  html += '</div>';

  html += '<div class="card-body">';

  // Messages panel (only if messages exist)
  if (msgs.length > 0) {
    html += '<div class="messages-toggle" onclick="toggleMessages(' + i + ')" id="msg-toggle-' + i + '">';
    html += '<span class="messages-toggle-label">✉ Messages (' + msgs.length + ')</span>';
    html += '<span class="messages-chevron" id="msg-chev-' + i + '">▶</span>';
    html += '</div>';
    html += '<div class="messages-panel" id="msg-panel-' + i + '">';
    html += '<div class="messages-scroll">';
    // REVERSED: newest messages first
    var msgsReversed = msgs.slice().reverse();
    msgsReversed.forEach(function(m) {
      html += '<div class="message-item">';
      html += '<div class="message-item-meta">';
      html += '<span class="message-item-from">' + esc(m.name || 'Customer') + '</span>';
      if (m.link) html += '<a class="message-item-link" href="' + esc(m.link) + '" target="_blank">View Thread →</a>';
      html += '</div>';
      html += '<div class="message-item-text">' + esc(m.text) + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  if (o.pers) {
    html += '<div class="section-label">Personalization</div>';
    html += '<div class="pers-box">' + esc(o.pers) + '</div>';
  }
  if (o.filePath) {
    html += '<div class="section-label">File Path</div>';
    html += '<div class="file-path">' + esc(o.filePath) + '</div>';
  }

  html += '<div class="section-label">Type</div>';
  html += '<select class="type-select" id="type-select-' + i + '" onchange="setSkuOverride(' + i + ', this.value)">';
  ['default','wood','emboss'].forEach(function(cat) {
    html += '<option value="' + cat + '"' + (effectiveType === cat ? ' selected' : '') + '>' + TYPE_LABELS[cat] + '</option>';

  html += '<div class="production-note-area">';
  html += '<div class="production-note-display' + (note ? ' visible' : '') + '" id="note-display-' + i + '">Production note: ' + esc(note) + '</div>';

  if (o.slipUrl)   html += '<a class="btn btn-green" href="' + esc(o.slipUrl) + '" target="_blank">View Delivery Slip</a>';
  html += '</div>';

  html += '<div class="section-label" style="margin-top:14px">Status</div>';
  html += '<div class="status-actions">';
  html += '<button class="s-btn s-btn-proof-complete' + (st==='proof-complete' ? ' active':'') + '" onclick="setOrderStatus(' + i + ',\'proof-complete\')">Proof Ready</button>';
  html += '<button class="s-btn s-btn-proof'          + (st==='proof'          ? ' active':'') + '" onclick="setOrderStatus(' + i + ',\'proof\')">Proof Sent</button>';
  html += '<button class="s-btn s-btn-approved'       + (st==='approved'       ? ' active':'') + '" onclick="setOrderStatus(' + i + ',\'approved\')">Approved</button>';
  html += '<button class="s-btn s-btn-production' + (st==='production' ? ' active':'') + '" onclick="setOrderStatus(' + i + ',\'production\')">Sent to Production</button>';
  html += '<button class="s-btn s-btn-complete'   + (st==='complete'   ? ' active':'') + '" onclick="setOrderStatus(' + i + ',\'complete\')">Complete</button>';
  if (st) html += '<button class="s-btn s-btn-none" onclick="setOrderStatus(' + i + ',\'\')">Clear</button>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

function renderOrders() {
  var app = document.getElementById('app');
  var html = '';
  
  // Group orders by status, and if status is 'approved', further group by SKU
  var byStatus = {};
  ordersData.forEach(function(o, i) {
    var st = statusData[o.id] || '';
    if (!byStatus[st]) byStatus[st] = [];
    byStatus[st].push({ order: o, index: i });
  });

  // Define order of statuses to render
  var statusOrder = ['', 'proof-complete', 'proof', 'approved', 'production', 'complete'];
  
  statusOrder.forEach(function(status) {
    var orders = byStatus[status];
    if (!orders || orders.length === 0) return;

    if (status === 'approved') {
      // Group approved orders by effective SKU category (manual override wins over auto-detection)
      var bySkuCat = { default: [], wood: [], emboss: [] };
      orders.forEach(function(item) {
        var cat = getEffectiveSkuCategory(item.order);
        bySkuCat[cat].push(item);
      });

      var skuOrder = ['default', 'wood', 'emboss'];
      var skuTitles = { default: 'Self-Inking', wood: 'Wood Block', emboss: 'Embosser' };

      skuOrder.forEach(function(skuCat) {
        var items = bySkuCat[skuCat];
        if (items.length === 0) return;

        var isOpen = skuSubsectionState[skuCat] === true;
        var count = items.length;
        var title = skuTitles[skuCat];

        html += '<div class="sku-subsection' + (isOpen ? ' open' : '') + '" id="sku-sub-' + skuCat + '">';
        html += '<div class="sku-subsection-header" onclick="toggleSkuSubsection(\'' + skuCat + '\')">';
        html += '<span class="sku-subsection-title">' + title + '</span>';
        html += '<span class="sku-subsection-count">' + count + ' order' + (count !== 1 ? 's' : '') + '</span>';
        html += '<span class="sku-subsection-chevron">▼</span>';
        html += '</div>';
        html += '<div class="sku-subsection-cards">';
        
        items.forEach(function(item) {
          html += renderOrderCard(item.order, item.index);
        });

        html += '</div></div>';
      });
    } else {
      // Non-approved orders: render normally
      orders.forEach(function(item) {
        html += renderOrderCard(item.order, item.index);
      });
    }
  });

  app.innerHTML = html || '<div class="empty">No orders found.</div>';
  applyVisibility();
}

function toggleSkuSubsection(category) {
  var isOpen = skuSubsectionState[category] === true;
  skuSubsectionState[category] = !isOpen;
  
  var sub = document.getElementById('sku-sub-' + category);
  if (sub) {
    sub.classList.toggle('open');
  }
}

function setSkuOverride(i, value) {
  var o = ordersData[i];
  skuOverrideData[o.id] = value;
  saveSkuOverride();
  // Re-render so the order moves into the right subsection if it's Approved
  renderOrders();
}

function toggleMessages(i) {
  var panel = document.getElementById('msg-panel-' + i);
  var chev  = document.getElementById('msg-chev-' + i);
  if (!panel) return;
  var isOpen = panel.classList.contains('open');
  if (!isOpen) {
    panel.classList.add('open');
    if (chev) chev.textContent = '▼';
    // Mark as read: store count of messages seen
    var o = ordersData[i];
    var msgs = messagesData[o.orderNum] || [];
    msgReadData[o.orderNum] = msgs.length;
    saveMsgRead();
    // Remove badge from header
    var card = document.getElementById('card-' + i);
    if (card) {
      var badge = card.querySelector('.badge-msg');
      if (badge) badge.parentElement.remove();
    }
  } else {
    panel.classList.remove('open');
    if (chev) chev.textContent = '▶';
  }
}

function toggleCard(i) {
  var card = document.getElementById('card-' + i);
  var wasOpen = card.classList.contains('open');
  card.classList.toggle('open');

  // If opening the card (wasn't open before) and it has unread messages, auto-open messages panel
  if (!wasOpen && card.classList.contains('open')) {
    var o = ordersData[i];
    if (hasUnreadMessages(o)) {
      var panel = document.getElementById('msg-panel-' + i);
      if (panel && !panel.classList.contains('open')) {
        toggleMessages(i);
      }
    }
  }
}

function toggleSelect(e, i) {
  e.stopPropagation();
  var o = ordersData[i];
  if (selectedIds[o.id]) { delete selectedIds[o.id]; document.getElementById('card-' + i).classList.remove('selected'); }
  else { selectedIds[o.id] = true; document.getElementById('card-' + i).classList.add('selected'); }
  updateSelectionUI();
}

function toggleSelectAll(checked) {
  ordersData.forEach(function(o, i) {
    var card = document.getElementById('card-' + i);
    if (!card || card.classList.contains('hidden')) return;
    var cb = document.getElementById('cb-' + i);
    if (checked) { selectedIds[o.id] = true; card.classList.add('selected'); if (cb) cb.checked = true; }
    else { delete selectedIds[o.id]; card.classList.remove('selected'); if (cb) cb.checked = false; }
  });
  updateSelectionUI();
}

function clearSelection() {
  selectedIds = {};
  ordersData.forEach(function(o, i) {
    var card = document.getElementById('card-' + i);
    if (card) card.classList.remove('selected');
    var cb = document.getElementById('cb-' + i);
    if (cb) cb.checked = false;
  });
  var saCb = document.getElementById('select-all-cb');
  if (saCb) saCb.checked = false;
  updateSelectionUI();
}

function updateSelectionUI() {
  var count = Object.keys(selectedIds).length;
  var banner = document.getElementById('selection-banner');
  var bannerCount = document.getElementById('selection-banner-count');
  var bar = document.getElementById('bulk-bar');
  var bulkCount = document.getElementById('bulk-count');

  var slipCount = 0;
  Object.keys(selectedIds).forEach(function(id) {
    var o = ordersData.find(function(x) { return x.id === id; });
    if (o && o.slipUrl) slipCount++;
  });
  var slipBtn = document.getElementById('copy-slips-btn');
  if (slipBtn) {
    slipBtn.disabled = slipCount === 0;
    slipBtn.textContent = slipCount > 0 ? 'Copy ' + slipCount + ' Slip Link' + (slipCount !== 1 ? 's' : '') : 'Copy Slip Links';
  }

  if (count > 0) {
    banner.classList.add('visible');
    bannerCount.textContent = count + ' order' + (count !== 1 ? 's' : '') + ' selected';
    bar.classList.add('visible');
    bulkCount.textContent = count + ' selected';
  } else {
    banner.classList.remove('visible');
    bar.classList.remove('visible');
  }
  updateCount();
}

function setOrderStatus(i, status) {
  var o = ordersData[i];
  if (status === 'production') {
    openModal([o.id], function(note) {
      if (note !== null) { notesData[o.id] = note; saveNotes(); }
      applyStatus([o.id], 'production');
      renderOrders();
    });
  } else {
    applyStatus([o.id], status);
    renderOrders();
  }
}

function applyStatus(ids, status) {
  ids.forEach(function(id) {
    if (status === '') {
      delete statusData[id];
      delete proofTimeData[id];
    } else {
      statusData[id] = status;
      if (status === 'proof') {
        proofTimeData[id] = Date.now(); // reset timestamp each time proof is sent
      } else {
        delete proofTimeData[id];
      }
    }
  });
  saveStatus();
  saveProofTime();
}

function bulkSetStatus(status) {
  var ids = Object.keys(selectedIds);
  if (ids.length === 0) return;
  if (status === 'production') {
    openModal(ids, function(note) {
      if (note !== null && note !== '') { ids.forEach(function(id) { notesData[id] = note; }); saveNotes(); }
      applyStatus(ids, 'production');
      clearSelection();
      renderOrders();
    });
  } else {
    applyStatus(ids, status);
    clearSelection();
    renderOrders();
  }
}

function openModal(ids, callback) {
  var names = ids.map(function(id) {
    var o = ordersData.find(function(x) { return x.id === id; });
    return o ? o.name : id;
  });
  var desc = ids.length === 1
    ? 'Add a production note for ' + names[0] + ' (optional).'
    : 'Add a production note for ' + ids.length + ' orders (optional). Same note applied to all.';
  document.getElementById('modal-desc').textContent = desc;
  document.getElementById('modal-note').value = ids.length === 1 ? (notesData[ids[0]] || '') : '';
  modalContext = { ids: ids, callback: callback };
  document.getElementById('modal-overlay').classList.add('visible');
  setTimeout(function() { document.getElementById('modal-note').focus(); }, 50);
}

function modalSave() {
  if (!modalContext) return;
  var note = document.getElementById('modal-note').value.trim();
  document.getElementById('modal-overlay').classList.remove('visible');
  modalContext.callback(note);
  modalContext = null;
}

function modalSkip() {
  if (!modalContext) return;
  document.getElementById('modal-overlay').classList.remove('visible');
  modalContext.callback(null);
  modalContext = null;
}

function saveNoteInline(i) {
  var o = ordersData[i];
  var input = document.getElementById('note-input-' + i);
  if (!input) return;
  var note = input.value.trim();
  notesData[o.id] = note;
  saveNotes();
  var display = document.getElementById('note-display-' + i);
  if (display) { display.textContent = 'Production note: ' + note; display.classList.toggle('visible', !!note); }
  var btn = input.parentElement ? input.parentElement.querySelector('.note-save-btn') : null;
  if (btn) { var orig = btn.textContent; btn.textContent = '✓ Saved'; setTimeout(function() { btn.textContent = orig; }, 1500); }
}

function savePrivateNoteInline(i) {
  var o = ordersData[i];
  var input = document.getElementById('private-note-input-' + i);
  if (!input) return;
  var note = input.value.trim();
  privateNotesData[o.id] = note;
  savePrivateNotes();
  var btn = input.parentElement ? input.parentElement.querySelector('.private-note-save-btn') : null;
  if (btn) { var orig = btn.textContent; btn.textContent = '✓ Saved'; setTimeout(function() { btn.textContent = orig; }, 1500); }
  // Re-render so the "● Note" badge in the card header reflects the change
  renderOrders();
  var card = document.getElementById('card-' + i);
  if (card) card.classList.add('open');
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.getElementById('filter-' + f);
  if (btn) btn.classList.add('active');
  applyVisibility();
}

function clearNoteSearch() {
  var el = document.getElementById('note-search');
  if (el) { el.value = ''; applyVisibility(); }
}

function applyVisibility() {
  var noteEl = document.getElementById('note-search');
  var noteQuery = noteEl ? noteEl.value.trim().toLowerCase() : '';
  var counts = { all: 0, proof: 0, 'proof-complete': 0, approved: 0, production: 0, complete: 0, pending: 0 };
  ordersData.forEach(function(o, i) {
    var card = document.getElementById('card-' + i);
    if (!card) return;
    var st = statusData[o.id] || '';
    counts.all++;
    if (st) counts[st] = (counts[st] || 0) + 1;
    else counts.pending++;
    var matchesStatus = activeFilter === 'all' || (activeFilter === 'pending' && !st) || activeFilter === st;
    var note = (notesData[o.id] || '').toLowerCase();
    var privateNote = (privateNotesData[o.id] || '').toLowerCase();
    var matchesNote = !noteQuery || note.indexOf(noteQuery) !== -1 || privateNote.indexOf(noteQuery) !== -1;
    card.classList.toggle('hidden', !(matchesStatus && matchesNote));
  });
  
  // Hide empty SKU subsections
  var skuSubs = document.querySelectorAll('.sku-subsection');
  skuSubs.forEach(function(sub) {
    var visibleCards = sub.querySelectorAll('.order-card:not(.hidden)');
    sub.classList.toggle('hidden', visibleCards.length === 0);
  });
  
  updateCount(counts);
}

var SLIP_MERGE_PAYLOAD_KEY = 'slc_slip_merge_payload';

function copySelectedLinks(type) {
  var ids = Object.keys(selectedIds);
  var btnId = type === 'msg' ? 'copy-msg-links-btn' : type === 'slip' ? 'copy-slips-btn' : 'copy-links-btn';

  if (type === 'slip') {
    // Hand off url + stamp text (Type + Private Note) per order via localStorage, rather than
    // a plain URL query string — this avoids URL length limits and lets the merger tool
    // stamp each slip with the right text automatically.
    var records = [];
    ids.forEach(function(id) {
      var o = ordersData.find(function(x) { return x.id === id; });
      if (o && o.slipUrl) records.push({ url: o.slipUrl, stamp: buildSlipStampText(o) });
    });
    if (!records.length) return;
    try {
      localStorage.setItem(SLIP_MERGE_PAYLOAD_KEY, JSON.stringify({ ts: Date.now(), records: records }));
    } catch(e) {}
    window.open('slip-merger.html', '_blank');
    var btn = document.getElementById(btnId);
    if (btn) {
      var orig = btn.textContent;
      btn.textContent = '✓ Opening Merger...';
      setTimeout(function() { btn.textContent = orig; }, 2000);
    }
    return;
  }

  var lines = [];
  ids.forEach(function(id) {
    var o = ordersData.find(function(x) { return x.id === id; });
    if (!o) return;
    var url = type === 'msg' ? o.msgLink : o.orderLink;
    if (url) lines.push(url);
  });
  if (!lines.length) return;
  var text = lines.join('\n');
  copyToClipboard(text, function() {
    var btn = document.getElementById(btnId);
    if (btn) {
      var orig = btn.textContent;
      btn.textContent = '✓ ' + lines.length + ' Links Copied!';
      setTimeout(function() { btn.textContent = orig; }, 2000);
    }
  });
}

function copyToClipboard(text, callback) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  if (ok) { if (callback) callback(); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { if (callback) callback(); }); }
}

function updateCount(counts) {
  if (!counts) {
    counts = { all: 0, proof: 0, approved: 0, production: 0, complete: 0, pending: 0 };
    ordersData.forEach(function(o) {
      var st = statusData[o.id] || '';
      counts.all++;
      if (st) counts[st] = (counts[st] || 0) + 1;
      else counts.pending++;
    });
  }
  var visible = activeFilter === 'all' ? counts.all : activeFilter === 'pending' ? counts.pending : (counts[activeFilter] || 0);
  document.getElementById('order-count').textContent =
    visible + ' order' + (visible !== 1 ? 's' : '') +
    ' · ' + counts.pending + ' pending · ' + (counts.proof||0) + ' proof sent · ' +
    (counts['proof-complete']||0) + ' proof complete · ' +
    (counts.approved||0) + ' approved · ' + (counts.production||0) + ' production · ' +
    (counts.complete||0) + ' complete';
}

function copyField(i, field) {
  var o = ordersData[i];
  var text = field === 'file' ? o.filePath : o.pers;
  var btnId = field === 'file' ? 'cf-' + i : 'cp-' + i;
  if (!text) return;
  copyToClipboard(text, function() { flashCopied(btnId); });
}

function flashCopied(btnId) {
  var btn = document.getElementById(btnId);
  if (!btn) return;
  var orig = btn.textContent;
  btn.classList.add('copied');
  btn.textContent = '✓ Copied!';
  setTimeout(function() { btn.classList.remove('copied'); btn.textContent = orig; }, 1800);
}

loadOrders();
</script>
